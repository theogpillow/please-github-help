kind = "mobile"
previewPath = "/nitra-mobile/"
title = "Nitra Mobile"
version = "1.0.0"
id = "artifacts/nitra-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/nitra-mobile/" ]
localPort = 20177

[services.development]
run = "pnpm --filter @workspace/nitra-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nitra-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/nitra-mobile", "run", "serve" ]

[services.env]
PORT = "20177"
BASE_PATH = "/nitra-mobile/"
