kind = "web"
previewPath = "/"
title = "Nitra"
version = "1.0.0"
id = "artifacts/nitra"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19238

[services.development]
run = "pnpm --filter @workspace/nitra run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nitra", "run", "build" ]
serve = "static"
publicDir = "artifacts/nitra/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19238"
BASE_PATH = "/"
